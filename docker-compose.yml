# The project name is fixed so container and volume names do not depend on the
# checkout's directory (production lives in /opt/voydodmoviebot).
name: voydodmoviebot

# The production host has no global Docker log limit, so every container caps
# its own logs here.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` on purpose. Docker publishes ports around the host firewall
    # (ufw), so a published 5432 is open to the whole internet. The bot reaches
    # the database by its service name on the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *logging

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_IDS: ${ADMIN_IDS}
    # The bot only handles Telegram file_ids, never the videos themselves.
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
